workflows:
  android-release:
    name: Daily Facts — Android APK
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Дозаполнить платформенные файлы
        script: |
          if [ ! -f android/settings.gradle ]; then
            flutter create --org com.example --project-name daily_facts_app .
          fi
      - name: Применить дополнения к AndroidManifest.xml
        script: |
          python3 scripts/patch_manifest.py
      - name: flutter pub get
        script: |
          flutter pub get
      - name: Собрать release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients: []
